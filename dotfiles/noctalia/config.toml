# noctalia v5 手写配置层。
#
# 这个目录被只读软链到 ~/.config/noctalia/，是官方支持的用法：inotify 热重载，
# 而且 GUI / IPC 改出来的值会写进 ~/.local/state/noctalia/settings.toml —— 那一层
# 按加载顺序最后生效、覆盖本文件。某个设置“不生效”时先去看/删那个文件。
# 目录里所有 *.toml 都会被合并加载，所以只留一个 config.toml 最省心。

[theme]
mode = "dark"
# source = "wallpaper" 相当于 dms 的 enableDynamicTheming：配色从壁纸生成，换壁纸就换主题。
# 想固定用内置配色就改成 "builtin" + builtin = "Noctalia"。
source = "wallpaper"
wallpaper_scheme = "m3-content"
builtin = "Noctalia"

[wallpaper]
enabled = true
fill_mode = "crop"
transition = [ "fade" ]
transition_duration = 1500

# 概览（Mod+A）里的模糊壁纸背景，需要 niri 侧那条 noctalia-backdrop 的 layer-rule 配套
# （见 dotfiles/niri/noctalia.kdl），两者要么一起开、要么一起关。
[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3

[shell]
# noctalia 的界面语言默认跟随 LC_ALL / LC_MESSAGES / LANG —— 本机 LC_ALL=en_US.UTF-8，不写就是英文界面。
# zh-CN / zh-Hans 都是简体中文；想回到跟随环境变量就删掉这一行或写成空字符串。
lang = "zh-CN"

[bar.default]
position = "top"
enabled = true
thickness = 34
radius = 12
margin_ends = 100
padding = 14
widget_spacing = 6

start = [ "launcher", "wallpaper", "workspaces" ]
center = [ "clock" ]
end = [
  "media",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]

[lockscreen]
enabled = true
# 挂起/合盖前自动锁屏，替代原来 swayidle 里 before-sleep 那一份
lock_before_suspend = true
# 锁屏时抓一张桌面快照当背景（原来是 dms 的锁屏模糊效果）
blurred_desktop = true
blur_intensity = 0.6
tint_intensity = 0.35

# noctalia 默认就接管 org.freedesktop.Notifications；本机没有别的通知守护，保持默认即可。
# 剪贴板历史的加密主密钥走 Secret Service（niri 模块默认启用 gnome-keyring）。
# polkit 认证仍由 startup.kdl 里的 polkit-gnome 负责，所以 [shell] polkit_agent 保持默认关闭。
[notification]
enable_daemon = true
