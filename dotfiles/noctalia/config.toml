# noctalia v5 手写配置层。
#
# 这个目录被只读软链到 ~/.config/noctalia/，是官方支持的用法：inotify 热重载，
# 而且 GUI / IPC 改出来的值会写进 ~/.local/state/noctalia/settings.toml —— 那一层
# 按加载顺序最后生效、覆盖本文件。某个设置“不生效”时先去看/删那个文件。
# 目录里所有 *.toml 都会被合并加载，所以只留一个 config.toml 最省心。

[bar.default]
background_opacity = 0.60999998636543751
capsule_radius = 15
center = [ "group:g1" ]
contact_shadow = true
end = [ "group:g3", "group:g2" ]
font_family = "LXGW WenKai"
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "workspaces", "active_window" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network_rx", "network", "bluetooth", "volume", "brightness", "battery", "settings", "session" ]
    opacity = 1.0
    padding = 6.0
    radius = 15.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "caffeine", "tray", "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0
    radius = 15.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "notifications", "date", "audio_visualizer", "media" ]
    opacity = 1.0
    padding = 6.0
    radius = 15.0

[control_center]
hidden_tabs = [ "weather", "calendar" ]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 900.0
    cy = 943.0
    output = "eDP-1"
    placement_height = 1125.0
    placement_width = 1800.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
position = "top_center"

[shell]
corner_radius_scale = 2.0
font_family = "LXGW WenKai"
lang = "zh-Hans"
panel_anchor_bar = "default"

    [shell.launcher]
    app_grid = true

    [shell.panel]
    clipboard_placement = "attached"
    floating_layer = "top"
    launcher_placement = "attached"
    polkit_placement = "attached"
    transparency_mode = "soft"

[theme]
mode = "dark"
pure_black_dark = true
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "ghostty", "niri", "qt", "starship" ]

[wallpaper]
directory = "/home/keith/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/keith/Pictures/Wallpapers/dawn of war.png"

    [wallpaper.last]
    path = "/home/keith/Pictures/Wallpapers/dawn of war.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/keith/Pictures/Wallpapers/dawn of war.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/keith/Pictures/Wallpapers/dawn of war.png"

[widget.audio_visualizer]
centered = false
interactive = false
mirrored = false

[widget.clock]
format = "{:%Y-%m-%d %H:%M}"

[widget.cpu]
visualization = "none"

[widget.date]
format = "{:%Y-%m-%d :%H:%M}"

[widget.media]
hide_when_no_media = true
show_progress = true
title_scroll = "always"

[widget.network]
show_label = false
vpn_status = "hidden"

[widget.network_rx]
glyph = "arrow-down"
visualization = "none"

[widget.ram]
visualization = "none"

[widget.temp]
visualization = "none"

[widget.workspaces]
# bar 上的编号取自 niri 的 workspace idx（label_source 默认 "id"），跟 workspace 叫什么名字无关，
# 所以名字用 "1"/"2"/"3" 还是 "browser" 都不影响显示。要直接显示名字就写
# label_source = "name"，并把 max_label_chars 调大（默认 1，会把 program_develop 截成 p）。
labels_only_when_occupied = true
