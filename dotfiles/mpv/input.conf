# mpv 按键配置：vim 风格。
#
# 这个文件是 out-of-store 软链（~/.config/mpv/input.conf -> 仓库），存盘即生效，不用 rebuild。
# 行尾 `#! 说明` 是 mpv 自带的键位描述，按 ? 键（stats 第 4 页）能列出来。
#
# 只改「移动/跳转」这一类，mpv 默认键位本来就有一半很 vim，全部保留：
#   q 退出 / Q 退出并记住进度 / Space、p 暂停 / f 全屏 / m 静音 / 9、0 音量
#   [ ] 变速 / BS 恢复 1x / z Z 字幕延迟 / v 字幕显隐 / s 截图 / i 统计 / o 进度
#   # 切换音轨 / _ 切换视频轨 / < > Enter 上/下一个文件 / , . 逐帧
#   PGUP PGDN 章节 / Shift+PGUP、Shift+PGDN 前后 10 分钟 / HOME 回到开头
#
# 被顶掉的三个默认键挪到了 Ctrl 上（见文件末尾）；不想要就注释掉那几行。

# ── hjkl：方向键的 vim 版 ─────────────────────────────────────
h seek -5            #! 后退 5 秒（= ←）
l seek 5             #! 前进 5 秒（= →）
j seek -60           #! 后退 60 秒（= ↓）
k seek 60            #! 前进 60 秒（= ↑）

# ── Ctrl+u / Ctrl+d：按文件长度跳 10%（vim 的翻半页）──────────
Ctrl+u seek -10%     #! 后退 10%
Ctrl+d seek 10%      #! 前进 10%

# ── 开头 / 结尾 ───────────────────────────────────────────────
HOME seek 0 absolute #! 回到开头（mpv 默认键位，写出来只为对照）
$ seek 100%          #! 跳到结尾

# ── 默认键位搬家（这三行覆盖 mpv 的同名默认键）─────────────────
Ctrl+j cycle sub     #! 切换字幕轨（原来是 j；J 仍是反向切换）
Ctrl+l ab-loop       #! 设置/清除 A-B 循环（原来是 l）
