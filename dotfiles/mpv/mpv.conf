# mpv 播放配置。
#
# 这个文件是 out-of-store 软链（~/.config/mpv/mpv.conf -> 仓库），存盘即生效，不用 rebuild。
# 这里只放播放体验相关的设置，键位在 input.conf。

# 硬件解码；驱动/编码不支持时 mpv 自己回退软解。
hwdec=auto-safe

# 退出时记住播放位置，下次打开同一个文件接着播（默认的 Q 键也是这个意思）。
save-position-on-quit=yes

# 外挂字幕模糊匹配：视频叫 xxx.mkv，同目录的 xxx.zh.srt / xxx.chs.ass 会自动挂上。
sub-auto=fuzzy

# 有多条音轨/字幕轨时优先中文，其次英文。
alang=zh,en
slang=zh,en

# s 键截图存 PNG（mpv 默认 jpg，再拿去标注会掉画质），
# 目录和 niri 的 screenshot-path 保持一致，方便 satty 直接打开最新一张。
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
