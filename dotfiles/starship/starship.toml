# ─────────────────────────────────────────────────────────────────────────────
# ⚠ 这个文件的一半归 noctalia 管：它的 starship 模板（state 层 builtin_ids 里的 "starship"）
#   换主题时会重写 `palette = ...` 那一行，并在文件末尾追加一段
#   `# >>> NOCTALIA STARSHIP PALETTE >>>` … `# <<< NOCTALIA STARSHIP PALETTE <<<`。
#   apply.sh 只动这两处、其余内容原样保留，所以换主题后本文件会变脏（看 diff 再决定提交）。
#   这也是 ~/.config/starship.toml 用 out-of-store 软链的原因（modules/home/starship.nix）——
#   指向只读的 store 软链会让那次写入报"只读文件系统"。
#   下面那份手写的 [palettes.catppuccin_mocha] 是模板关掉时的备用调色板，被 noctalia
#   接管后 `palette` 会指向 "noctalia"，它就成了死代码，留着不影响。
# ─────────────────────────────────────────────────────────────────────────────
# Don't print a new line at the start of the prompt
add_newline = true
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
palette = 'catppuccin_mocha'

format = """
$hostname$directory$git_branch
$character
"""

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[](bold fg:green) "
error_symbol = "[󰅙](bold fg:red) "

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg: green"
symbol = "󰘬"
truncation_length = 30
truncation_symbol = ""
format = "[](bold fg:green)[ $symbol $branch(:$remote_branch)](fg:#010101 bg:green)[ ](bold fg:green)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = "🏳 "
# ahead = " 🏎💨 "
# behind = " 😰 "
# diverged = " 😵 "
# untracked = " 🤷 ‍"
stashed = " "
modified = "[ $count](yellow)"
staged = '[ $count](green)'
renamed = "[󰑕 $count](cyan)"
deleted = "[ $count](red)"

[hostname]
ssh_only = true
format =  "[](bold fg:cyan )[$hostname](bg:cyan bold fg:#010101)[](bold fg:cyan )"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[directory]
home_symbol = " ~"
read_only = "  "
style = "bg:peach fg:crust"
# style = "bg:peach fg:crust"
truncation_length = 6
truncation_symbol = "••/"
format = '[](bold fg:peach)[$path ]($style)[](bold fg:peach)'


# [directory.substitutions]
# "Desktop" = "  "
# "Documents" = "  "
# "Downloads" = "  "
# "Music" = " 󰎈"
# "Pictures" = "  "
# "Videos" = "  "
[cmd_duration]
min_time = 0
format = '[](bold fg:yellow)[󰣇 $duration](bold bg:yellow fg:#010101)[](bold fg:yellow) '

[python]
symbol = ""
format = '[ $symbol $version ]($style)'

[golang]
symbol = " "
format = '[$symbol $version ]($style)'

[java]
symbol = ""
format = '[$symbol $version ]($style)'

[rust]
symbol = ""
format = '[$symbol $version ]($style)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

