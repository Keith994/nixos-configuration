set -g status-position top
# -- 通用设置 --
set -ga terminal-overrides ",xterm-ghostty:Tc"
setw -g xterm-keys on
set -s escape-time 10
set -sg repeat-time 60
set -s focus-events on
# 前缀键设为 Ctrl+a
set -g prefix C-a
set -g mouse on
# 窗口编号从 1 开始
set -g base-index 1
# 监控其他窗口活动
setw -g monitor-activity on
set -g visual-activity off
# 关闭窗口后自动重新编号
set -g renumber-windows on
set -g history-limit 10000
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 3

# 插件列表
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'ddzero2c/tmux-easymotion#v1.3.0'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-contjnuum'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @easymotion-s2 's'
set -g @easymotion-case-sensitive 'false'

set -g @rose_pine_variant 'moon'
set -g @rose_pine_host 'off'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_directory 'off'
set -g @rose_pine_bar_bg_disable "off"
# set -g @rose_pine_show_pane_directory 'on'
set -g @rose_pine_left_separator ':'
set -g @rose_pine_right_separator ' '
set -g @rose_pine_date_time ''
set -g @rose_pine_status_left_prepend_section '#{tmux_mode_indicator}'
set -g @rose_pine_status_right_prepend_section '#(gitmux -cfg $HOME/.config/tmux/.gitmux.conf "#{pane_current_path}")'

# 颜色备用配置（已禁用，由 rose-pine 主题接管）
# mode-indicator 提示文字
set -g @mode_indicator_prefix_prompt '   '
set -g @mode_indicator_copy_prompt '   '
set -g @mode_indicator_sync_prompt '   '
set -g @mode_indicator_empty_prompt '   '
# mode-indicator 颜色（纯 fg，与 rose-pine moon 风格一致）
set -g @mode_indicator_prefix_mode_style 'fg=#eb6f92,bold'
set -g @mode_indicator_copy_mode_style 'fg=#286983,bold'
set -g @mode_indicator_sync_mode_style 'fg=#eb6f92,bold'
set -g @mode_indicator_empty_mode_style 'fg=#9ccfd8,bold'

# 双击前缀键发送 C-a（行首）
bind C-a send-prefix
# 重载配置
bind r run '"$TMUX_PROGRAM" ${TMUX_SOCKET:+-S "$TMUX_SOCKET"} source "$TMUX_CONF"' \; display "#{TMUX_CONF} sourced"
# bind s choose-tree -swZ
# unbind 's'
bind w choose-tree -wZ

# 单快捷键切换水平/垂直布局
bind-key -r o run-shell "bash -c 'if tmux display-message -p \"#{window_layout}\" | grep -q \"{\"; then tmux select-layout even-vertical; else tmux select-layout even-horizontal; fi'"

# 波浪下划线支持
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[59::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# tmux-continuum & tmux-resurrect 配置
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# --- 快捷键 ---
bind e setw synchronize-panes
# 新建 session
bind C-c new-session
# 查找 session
bind C-f command-prompt -p find-session 'switch-client -t %%'
# 切换到上一个 session
bind BTab switch-client -l
# 前缀键分屏（| 横向，\ 纵向）
bind | split-window -h
bind \\ split-window -v
unbind '"'
unbind %
# 与下一个 pane 互换
bind > swap-pane -D
# 与上一个 pane 互换
bind < swap-pane -U
bind-key k clear-history

# Ctrl 方向键：pane 导航（与 neovim 联动）
# bind-key -n M-l send-keys C-l\;  run 'sleep 0.2' \; clear-history
# bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
# bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
# bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
# bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

# --- Alt 直接绑定（无需前缀键）---
bind-key -n M-h  'select-pane -L'
bind-key -n M-j  'select-pane -D'
bind-key -n M-k  'select-pane -U'
bind-key -n M-l  'select-pane -R'

# 窗口切换（Alt 数字 / Alt [] 前后翻）
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n M-[ previous-window
bind-key -n M-] next-window
bind-key -n 'M-{' swap-window -t -1\; select-window -t -1
bind-key -n 'M-}' swap-window -t +1\; select-window -t +1

# 分屏（保持当前路径）
bind-key -n 'M-\' split-window -h -c "#{pane_current_path}"
bind-key -n 'M-|' split-window -v -c "#{pane_current_path}"

# 新建窗口 / 关闭 pane / 全屏缩放
bind-key -n M-n new-window -c "#{pane_current_path}"
bind-key -n M-q kill-pane
bind-key -n M-m resize-pane -Z

# 将当前 pane 独立为新窗口
bind-key -n M-b break-pane

# session / 窗口选择器
bind-key -n M-s choose-tree -s
bind-key -n M-w choose-tree -wZ

# 浮动弹出终端
bind-key -n M-f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

# sessionizer（Alt-S）— 配置你的脚本路径
# bind-key -n M-S run-shell "~/.local/bin/sessionizer.sh"

# Ctrl 方向键：pane 调整大小
bind-key -n C-Left if -F "#{@pane-is-vim}" 'send-keys C-Left' 'resize-pane -L 3'
bind-key -n C-Down if -F "#{@pane-is-vim}" 'send-keys C-Down' 'resize-pane -D 3'
bind-key -n C-Up if -F "#{@pane-is-vim}" 'send-keys C-Up' 'resize-pane -U 3'
bind-key -n C-Right if -F "#{@pane-is-vim}" 'send-keys C-Right' 'resize-pane -R 3'

# 窗口导航
unbind n
unbind p
bind Tab last-window
# 切换鼠标模式
bind m run "cut -c3- '#{TMUX_CONF}' | sh -s _toggle_mouse"

# -- 复制模式 --
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
# 复制到 X11 剪贴板
if -b 'command -v xsel > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
# 复制到 Wayland 剪贴板
if -b '[ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | wl-copy"'
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | pbcopy"'
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - > /dev/clipboard"'
# -- 粘贴缓冲区 --
bind b list-buffers # 选择并放在剪切板里面去
bind p paste-buffer -p
bind P choose-buffer # 在粘贴缓冲区里面获取剪切并应用
# -- 8< ------------------------------------------------
%if #{==:#{TMUX_PROGRAM},}
  run 'TMUX_PROGRAM="$(LSOF=$(PATH="$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" command -v lsof); $LSOF -b -w -a -d txt -p #{pid} -Fn 2>/dev/null | perl -n -e "if (s/^n((?:.(?!dylib$|so$))+)$/\1/g && s/(?:\s+\([^\s]+?\))?$//g) { print; exit } } exit 1; {" || readlink "/proc/#{pid}/exe" 2>/dev/null)"; { [ -f "$TMUX_PROGRAM" ] && [ -x "$TMUX_PROGRAM" ]; } || TMUX_PROGRAM="$(command -v tmux || printf tmux)"; "$TMUX_PROGRAM" -S #{socket_path} set-environment -g TMUX_PROGRAM "$TMUX_PROGRAM"'
%endif
%if #{==:#{TMUX_SOCKET},}
  run '"$TMUX_PROGRAM" -S #{socket_path} set-environment -g TMUX_SOCKET "#{socket_path}"'
%endif
%if #{==:#{TMUX_CONF},}
  run '"$TMUX_PROGRAM" set-environment -g TMUX_CONF $(for conf in "$HOME/.tmux.conf" "$XDG_CONFIG_HOME/tmux/tmux.conf" "$HOME/.config/tmux/tmux.conf"; do [ -f "$conf" ] && printf "%s" "$conf" && break; done)'
%endif

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# 初始化 TPM（保持在文件末尾）
run '~/.tmux/plugins/tpm/tpm'

# 覆盖 rose-pine：active tab 改为 iris(紫)，与底栏金色区分
setw -g window-status-current-style "fg=#1f1d2e,bold,bg=#4e9a6f"
setw -g window-status-current-format " #I#[fg=#1f1d2e] #W#{?window_zoomed_flag,#[fg=#eb6f92] ,}#{?#{>:#{window_panes},1},#[fg=#1f1d2e] ·#{window_panes},}#[fg=#1f1d2e] #{b:pane_current_path} "
setw -g window-status-format " #I #W#{?window_zoomed_flag, ,}#{?#{>:#{window_panes},1} ·#{window_panes},} "
setw -g window-status-activity-style "fg=#ea9d34,none"
set -g pane-active-border-style "fg=#4e9a6f"
