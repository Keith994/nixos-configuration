[main]
include=~/.config/foot/themes/noctalia

# Example foot configuration (~/.config/foot/foot.ini)
# NOTE: exact option names can vary between foot versions. If an option
# is unrecognized by your installed foot, check your local manpage (man foot)
# or `foot --help` and adjust the key names accordingly.
term=xterm-256color
login-shell=yes


# app-id=foot # globally set wayland app-id. Default values are "foot" and "footclient" for desktop and server mode
# title=foot
# locked-title=no

# 字体链：拉丁/图标用 Maple（Nerd 图标 + 制表符齐全），中文显式点名 LXGW WenKai **Mono**。
# 只写 Maple 一个的话，中文走的是 fontconfig 的 lang=zh 规则塞进来的**比例版** LXGW WenKai
# （advance 0.333~1.0em 不等宽，post.isFixedPitch=0），这是 foot 报
# "font does not appear to be monospace" 的来源，也会让中文和符号对不齐格子。
# 注意写法：foot 的 font 是**逗号分隔的 fontconfig 字体列表**，逗号后不能有空格占位歧义。
# 顺序不能反 —— 第一个是 primary，后面的是缺字 fallback。
font=Maple Mono NF CN:pixelsize=13,LXGW WenKai Mono:pixelsize=13
# font-bold=<bold variant of regular font>
# font-italic=<italic variant of regular font>
# font-bold-italic=<bold+italic variant of regular font>
# font-size-adjustment=0.5

# 行距对齐 ghostty 的 adjust-cell-height=5：Maple 自身 hhea 度量是 asc 1.02 + desc 0.30
# = 1.32em，@12px 即 15.84px；ghostty 撑到 ~20.84px，所以这里给 21px。
# foot 的 line-height 是**绝对行高覆盖**（不是增量），默认取字体度量也就是 15.84px ——
# 这就是之前比 ghostty 挤一截的原因。
line-height=21px

# letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# underline-offset=<font metrics>
# underline-thickness=<font underline thickness>
# strikeout-thickness=<font strikeout thickness>
box-drawings-uses-font-glyphs=yes
# dpi-aware：保持 no。既然字体用 pixelsize 指定，dpi-aware 对它已经无效；而且这台机器
# 是 eDP-1(scale 1.6) + HDMI-A-1(scale 1) 混用，开了反而会让同一份配置在两个屏上物理大小不一致。
# dpi-aware=yes
# gamma-correct-blending=no

# initial-color-theme=1
# initial-window-size-pixels=700x500  # Or,
# initial-window-size-chars=<COLSxROWS>
# initial-window-mode=windowed
# pad=0x0 center-when-maximized-and-fullscreen
# resize-by-cells=yes
# resize-keep-grid=yes
# resize-delay-ms=100

# bold-text-in-bright=no
# word-delimiters=,│`|:"'()[]{}<>
# selection-target=primary
# workers=<number of logical CPUs>
# utmp-helper=/usr/lib/utempter/utempter  # When utmp backend is ‘libutempter’ (Linux)
# utmp-helper=/usr/libexec/ulog-helper    # When utmp backend is ‘ulog’ (FreeBSD)

# uppercase-regex-insert=yes

