[tweak]
# foot 的等宽告警只看**主字体**（fcft 读 post.isFixedPitch）：
#   Maple Mono NF CN  isFixedPitch = 1  ✅
#   LXGW WenKai       isFixedPitch = 0  ❌  ← 就是它在报警
#   LXGW WenKai Mono  isFixedPitch = 0  ❌  （等宽只体现在 advance 上，元数据没标）
# 中文必须用霞鹜文楷，就只能接受 mono 标志缺失；这里关掉告警，否则每次启动都刷一行。
# 注意：这个选项属于 [tweak] 段，写进 [main] 会让 foot 直接报 "not a valid option" 并以 230 退出。
font-monospace-warn=no

[cursor]
style=block
blink=yes
blink-rate=500
