patch:
  # 仅使用「雾凇拼音」的默认配置，配置此行即可
  __include: rime_ice_suggestion:/
  # 以下根据自己所需自行定义，仅做参考。
  # 针对对应处方的定制条目，请使用 <recipe>.custom.yaml 中配置，例如 rime_ice.custom.yaml
  __patch:
    # 方案列表：之前只启用了小鹤双拼，按全拼打字会出错
    # （例如输入 nihao 得到「你哈哦」），所以这里同时启用雾凇拼音（全拼）。
    schema_list:
      - schema: double_pinyin_flypy   # 小鹤双拼
    # 菜单
    menu:
      page_size: 8  # 候选词个数
      

    # 切换中英：
    # 不同的选项表示：打字打到一半时按下了 CapsLock、Shift、Control 后：
    # commit_code  上屏原始的编码，然后切换到英文
    # commit_text  上屏拼出的词句，然后切换到英文
    # clear        清除未上屏内容，然后切换到英文
    # inline_ascii 切换到临时英文模式，按回车上屏后回到中文状态
    # noop         屏蔽快捷键，不切换中英，但不要屏蔽 CapsLock
    ascii_composer:
      good_old_caps_lock: true  # true | false
      switch_key:
        Caps_Lock: noop      # commit_code | commit_text | clear
        Shift_L: noop  # commit_code | commit_text | inline_ascii | clear | noop
        Shift_R: noop         # commit_code | commit_text | inline_ascii | clear | noop
        Control_L: noop       # commit_code | commit_text | inline_ascii | clear | noop
        Control_R: noop       # commit_code | commit_text | inline_ascii | clear | noop
    key_binder/bindings/+:
      # 开启逗号句号翻页
      - { when: paging, accept: comma, send: Page_Up }
      - { when: has_menu, accept: period, send: Page_Down }
      - { when: composing, accept: Shift+Tab, send: Shift+Left }
      - { when: composing, accept: Tab, send: Shift+Right }

      - { when: composing, accept: Control+p, send: Up }
      - { when: composing, accept: Control+n, send: Down }
      - { when: has_menu, accept: Control+b, send: Page_Up }
      - { when: has_menu, accept: Control+f, send: Page_Down }
      # 注意：`accept: Shift` 不是合法的按键名，librime 会报
      # 「parse error: unrecognized key 'Shift'」并丢弃该条绑定。
      # 中英切换统一由上面的 ascii_composer/switch_key 控制。
      - { when: always, accept: Control+Alt+backslash, toggle: ascii_punct }
