<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <its:rules xmlns:its="http://www.w3.org/2005/11/its" version="1.0">
    <its:translateRule
      translate="no"
      selector="/fontconfig/*[not(self::description)]"
    />
  </its:rules>
  <alias>
    <family>Maple Mono NF CN,Maple Mono NF CN Medium</family>
    <prefer><family>Symbols Nerd Font</family></prefer>
  </alias>

  <!-- Font directory list -->

  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <!-- the following element will be removed in the future -->
  <dir>~/.fonts</dir>
  <dir>/etc/fonts</dir>

  <!-- 关闭内嵌点阵字体 -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- ── 默认字体：拉丁 = Maple Mono NF CN，中文 = 霞鹜文楷 LXGW WenKai ─────────
       Maple Mono NF CN 自带中文，所以"谁排在 family 列表第一位"决定一切。
       两组规则都用 qual="first"（只看 pattern 里**第一个** family），并且**顺序不能换**：
       中文那组在前、Maple 那组在后。

       为什么不用默认的 qual="any"：系统自带的 /etc/fonts/conf.d/49-sansserif.conf 会给任何
       不含 generic 的请求末尾追加一个 binding="weak" 的 "sans-serif"，于是显式 family 请求
       （"Maple Mono NF CN" / "DejaVu Sans" / "Symbols Nerd Font" / "Noto Sans CJK SC" …）
       的 family 列表里也带着 sans-serif，qual="any" 的 sans-serif 规则会把它们全判成
       sans-serif，再用 prepend_first 的文楷顶掉。实测（LANG=zh_CN.UTF-8，qual="any"）：
       fc-match 把上面那些**全部**返回霞鹜文楷 —— foot 的 font=Maple Mono NF CN 因此在
       zh locale 下变成比例字体文楷（foot 会报 not monospace，所以 foot.ini 里关了
       font-monospace-warn）。qual="first" 只认第一个 family，这类显式请求就不受影响了。

       为什么中文组要自己把 Maple 也 prepend 进去：它排在 Maple 组前面，文楷一旦插到第一位，
       后面 Maple 组的 qual="first" 就看不到 generic 了；顺手补上 Maple，family 列表才是
       [文楷, Maple, …]，缺字（Nerd Font 图标之类）还能从 Maple 兜底。

       请求带不带 lang=zh 取决于**进程的 locale**。umbriel 会把 [environment] 里的
       LANG=zh_CN.UTF-8 发布到 systemd user manager 和 D-Bus（niri 的 environment{} 只作用于
       自己 spawn 的子进程，niri-session 是在 niri 启动前 import 的登录环境），所以 umbriel 会话里
       几乎所有进程都带 lang=zh，而 niri 会话里走 systemd/D-Bus 的那些是 en_US ——
       这就是"同一份配置在两个会话里字体不一样"的根源。

       中文正文（serif/sans-serif/Sans）：文楷在前、Maple 兜底。
       monospace 反着来：等宽场景（终端、代码，以及 umbriel 自己写死 Pango "monospace" 的 UI）
       要 Maple 在前，文楷等宽只做兜底。 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="first" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>LXGW WenKai</string>
    </edit>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="first" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>LXGW WenKai</string>
    </edit>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>
  <match target="pattern">
    <!-- GTK 的默认 UI 字体就叫 "Sans"，不是 sans-serif，单独来一条 -->
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="first" name="family">
      <string>Sans</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>LXGW WenKai</string>
    </edit>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="first" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
    </edit>
  </match>

  <!-- 拉丁字形默认用 Maple Mono NF CN（连字 + Nerd Font 图标 + 自带中文）。
       原来这里是 Liga SFMono Nerd Font —— nixpkgs 里没有这个字体（SF Mono 是 Apple 授权字体，
       nerd-fonts 也没收录），family 解析不到时 serif/sans-serif/monospace 会整体 fallback 到 DejaVu，
       等于这段配置白写。改 family 名之前先确认 pkgs 里有对应字体。
       必须排在上面中文组之后，理由见那段注释。 -->
  <match target="pattern">
    <test qual="first" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>
  <match target="pattern">
    <!-- 同上：GTK 的默认 UI 字体是 "Sans" -->
    <test qual="first" name="family">
      <string>Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="first" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
  </match>

  <!-- Windows & Linux Chinese fonts. -->
  <!-- 把所有常见的中文字体映射到霞鹜文楷，这样当这些字体未安装时会用霞鹜文楷顶上.
解决特定程序指定使用某字体，并且在字体不存在情况下不会使用fallback字体导致中文显示不正常的情况.
（字体名必须和 pkgs 里实际提供的 family 完全一致，写错不会报错，只会静默 fallback。） -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>WenQuanYi Zen Hei</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>LXGW WenKai</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>WenQuanYi Micro Hei</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>LXGW WenKai</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>WenQuanYi Micro Hei Light</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>LXGW WenKai</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Microsoft YaHei</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>LXGW WenKai</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>SimHei</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>LXGW WenKai</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>SimSun</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>LXGW WenKai</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>SimSun-18030</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>LXGW WenKai</string>
    </edit>
  </match>

  <!-- Load local system customization file -->
  <include ignore_missing="yes">conf.d</include>

  <!-- Font cache directory list -->

  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- the following element will be removed in the future -->
  <cachedir>~/.fontconfig</cachedir>

  <config>
    <!-- Rescan configuration every 30 seconds when FcFontSetList is called -->
    <rescan>
      <int>30</int>
    </rescan>
  </config>
</fontconfig>
